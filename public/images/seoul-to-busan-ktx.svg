<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f1f8"/>
      <stop offset="1" stop-color="#fdf1e3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- Seoul skyline (left) -->
  <g fill="#7f9bb3">
    <rect x="40" y="300" width="60" height="180"/>
    <rect x="110" y="250" width="50" height="230"/>
    <rect x="170" y="320" width="70" height="160"/>
    <rect x="250" y="280" width="45" height="200"/>
    <rect x="216" y="180" width="8" height="40"/>
    <path d="M200 220 h40 l-8 30 h-24 z"/>
    <rect x="215" y="250" width="10" height="70"/>
  </g>
  <!-- Busan sea and mountains (right) -->
  <path d="M760 480 L860 330 L940 420 L1020 300 L1120 410 L1200 360 V480 z" fill="#9fb8a3"/>
  <rect x="760" y="440" width="440" height="40" fill="#5aa6d6"/>
  <!-- Gwangan bridge -->
  <g stroke="#3d6f99" stroke-width="5" fill="none">
    <path d="M780 440 Q900 370 1020 440"/>
    <path d="M1020 440 Q1110 380 1200 440"/>
    <line x1="900" y1="400" x2="900" y2="440"/>
    <line x1="1110" y1="405" x2="1110" y2="440"/>
  </g>
  <!-- ground and track -->
  <rect y="480" width="1200" height="150" fill="#cfdde8"/>
  <rect y="480" width="1200" height="10" fill="#4a6278"/>
  <!-- KTX train -->
  <g transform="translate(330 405)">
    <path d="M0 0 H420 Q500 0 530 55 L540 75 H0 z" fill="#ffffff" stroke="#0f4c81" stroke-width="4"/>
    <rect x="0" y="52" width="540" height="14" fill="#0f4c81"/>
    <path d="M440 8 Q490 12 515 45 H440 z" fill="#0f4c81"/>
    <g fill="#7fb3d9">
      <rect x="25" y="15" width="70" height="26" rx="4"/>
      <rect x="115" y="15" width="70" height="26" rx="4"/>
      <rect x="205" y="15" width="70" height="26" rx="4"/>
      <rect x="295" y="15" width="70" height="26" rx="4"/>
    </g>
  </g>
  <!-- speed lines -->
  <g stroke="#0f4c81" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="230" y1="420" x2="310" y2="420"/>
    <line x1="200" y1="445" x2="310" y2="445"/>
    <line x1="250" y1="470" x2="310" y2="470"/>
  </g>
  <!-- title -->
  <text x="600" y="110" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#0f2a44" text-anchor="middle">Seoul → Busan by KTX</text>
  <text x="600" y="170" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#3d5a73" text-anchor="middle">About 2 h 30 min · ₩54,400 one way (Oct 2026)</text>
  <text x="600" y="580" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#3d5a73" text-anchor="middle">Seoul &amp; Suseo stations · Korail+ booking · Korail Pass</text>
</svg>
