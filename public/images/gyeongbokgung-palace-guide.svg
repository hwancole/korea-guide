  <g fill="#e0a640"><circle cx="330" cy="293" r="6"/><circle cx="430" cy="293" r="6"/><circle cx="530" cy="293" r="6"/><circle cx="600" cy="293" r="6"/><circle cx="670" cy="293" r="6"/><circle cx="770" cy="293" r="6"/><circle cx="870" cy="293" r="6"/></g>
