    <g transform="translate(560 420)"><path d="M0 0 C-28 -40 -28 -78 0 -78 C28 -78 28 -40 0 0 z" fill="#d64545"/><circle cx="0" cy="-52" r="10" fill="#fff"/></g>
    <g transform="translate(780 385)"><path d="M0 0 C-28 -40 -28 -78 0 -78 C28 -78 28 -40 0 0 z" fill="#d64545"/><circle cx="0" cy="-52" r="10" fill="#fff"/></g>
    <g transform="translate(900 600)"><path d="M0 0 C-28 -40 -28 -78 0 -78 C28 -78 28 -40 0 0 z" fill="#d64545"/><circle cx="0" cy="-52" r="10" fill="#fff"/></g>
  </g>
  <!-- hotel building -->
  <g transform="translate(950 120)">
    <rect width="150" height="280" fill="#3d4f63"/>
    <rect x="35" y="-30" width="80" height="30" fill="#c8453a"/>
    <g fill="#f4d58d">
