<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a33"/>
      <stop offset="1" stop-color="#26385e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- city towers -->
  <g fill="#1b2747">
    <rect x="30" y="250" width="80" height="380"/><rect x="120" y="200" width="60" height="430"/>
    <rect x="190" y="290" width="100" height="340"/><rect x="900" y="230" width="90" height="400"/>
    <rect x="1000" y="280" width="80" height="350"/>
    <path d="M1110 630 L1110 150 L1135 60 L1160 150 L1160 630 z"/>
  </g>
  <g fill="#f5d78a" opacity="0.5">
