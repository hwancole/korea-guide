<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dcc8"/>
      <stop offset="1" stop-color="#fbf1e6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- distant hills -->
  <path d="M0 360 L180 280 L360 340 L560 260 L760 330 L960 270 L1200 330 V420 H0 z" fill="#d9c3b0"/>
  <!-- palace gate -->
  <g transform="translate(130 170)">
    <rect x="40" y="150" width="380" height="150" fill="#b8a48f"/>
    <rect x="70" y="120" width="320" height="40" fill="#2f6b5e"/>
    <path d="M0 125 Q230 70 460 125 L430 100 Q230 40 30 100 z" fill="#3b3b40"/>
    <path d="M60 60 Q230 15 400 60 L380 40 Q230 0 80 40 z" fill="#3b3b40"/>
    <rect x="90" y="60" width="280" height="40" fill="#2f6b5e"/>
    <rect x="80" y="100" width="18" height="200" fill="#a23b2c"/>
    <rect x="362" y="100" width="18" height="200" fill="#a23b2c"/>
    <path d="M180 300 V220 Q230 180 280 220 V300 z" fill="#5a4636"/>
    <rect x="-40" y="300" width="540" height="14" fill="#9c8a77"/>
  </g>
  <!-- lanterns -->
  <path d="M0 40 Q300 110 600 60 T1200 60" fill="none" stroke="#6b5a4a" stroke-width="2"/>
  <g fill="#d1382c">
    <g transform="translate(120 72)"><line y1="-12" y2="0" stroke="#6b5a4a" stroke-width="2"/><ellipse cy="22" rx="20" ry="24"/><rect x="-7" y="44" width="14" height="10" fill="#f2b33d"/></g>
    <g transform="translate(330 92)"><line y1="-12" y2="0" stroke="#6b5a4a" stroke-width="2"/><ellipse cy="22" rx="20" ry="24"/><rect x="-7" y="44" width="14" height="10" fill="#f2b33d"/></g>
    <g transform="translate(560 64)"><line y1="-12" y2="0" stroke="#6b5a4a" stroke-width="2"/><ellipse cy="22" rx="20" ry="24"/><rect x="-7" y="44" width="14" height="10" fill="#f2b33d"/></g>
    <g transform="translate(800 44)"><line y1="-12" y2="0" stroke="#6b5a4a" stroke-width="2"/><ellipse cy="22" rx="20" ry="24"/><rect x="-7" y="44" width="14" height="10" fill="#f2b33d"/></g>
    <g transform="translate(1040 62)"><line y1="-12" y2="0" stroke="#6b5a4a" stroke-width="2"/><ellipse cy="22" rx="20" ry="24"/><rect x="-7" y="44" width="14" height="10" fill="#f2b33d"/></g>
  </g>
  <!-- snowy ground -->
  <path d="M0 480 Q300 450 600 475 T1200 465 V630 H0 z" fill="#ffffff"/>
  <!-- table with tteokguk -->
  <g transform="translate(860 330)">
    <ellipse cx="80" cy="190" rx="200" ry="40" fill="#7b4a2e"/>
    <rect x="-100" y="185" width="360" height="22" fill="#5e3820"/>
    <!-- bowl -->
    <path d="M0 140 Q80 230 160 140 z" fill="#1f3c66"/>
    <ellipse cx="80" cy="140" rx="80" ry="18" fill="#f4efe4"/>
    <ellipse cx="55" cy="138" rx="18" ry="7" fill="#ffffff" stroke="#e2d9c7"/>
    <ellipse cx="95" cy="142" rx="18" ry="7" fill="#ffffff" stroke="#e2d9c7"/>
    <ellipse cx="78" cy="133" rx="16" ry="6" fill="#ffffff" stroke="#e2d9c7"/>
    <path d="M70 128 l10 -4 l6 6 z" fill="#f2b33d"/>
    <path d="M100 135 l12 -2" stroke="#3f8a4a" stroke-width="4"/>
    <!-- steam -->
    <path d="M60 110 q-10 -20 0 -40 q10 -20 0 -40" fill="none" stroke="#c9b9a6" stroke-width="4" stroke-linecap="round"/>
    <path d="M100 110 q-10 -20 0 -40 q10 -20 0 -40" fill="none" stroke="#c9b9a6" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- yut sticks -->
  <g transform="translate(660 520) rotate(-12)">
    <rect x="0" y="0" width="120" height="16" rx="8" fill="#e8c38f"/>
    <rect x="10" y="26" width="120" height="16" rx="8" fill="#d8a96a"/>
    <rect x="-5" y="52" width="120" height="16" rx="8" fill="#e8c38f"/>
    <rect x="15" y="78" width="120" height="16" rx="8" fill="#d8a96a"/>
  </g>
  <!-- title -->
  <text x="60" y="580" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#7a2b20">Seollal 2027</text>
  <text x="60" y="612" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5a4636">Korean Lunar New Year · Feb 6–9</text>
</svg>
