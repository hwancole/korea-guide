  <g fill="#ffd34d">
    <circle cx="560" cy="230" r="6"/><circle cx="640" cy="215" r="6"/><circle cx="530" cy="335" r="6"/>
    <circle cx="600" cy="310" r="6"/><circle cx="680" cy="340" r="6"/><circle cx="480" cy="455" r="6"/>
    <circle cx="560" cy="430" r="6"/><circle cx="650" cy="440" r="6"/><circle cx="730" cy="460" r="6"/>
  </g>
  <g fill="#e04f5f">
