  <!-- market stalls -->
  <g>
    <rect x="90" y="440" width="220" height="110" fill="#8a5a3b"/>
    <path d="M70 445 L200 380 L330 445 z" fill="#f3f1ea"/>
    <rect x="110" y="470" width="180" height="40" fill="#f2b25b"/>
    <rect x="890" y="440" width="220" height="110" fill="#8a5a3b"/>
