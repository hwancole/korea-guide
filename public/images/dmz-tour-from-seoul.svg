<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9dbe6"/>
      <stop offset="1" stop-color="#eef2ee"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb0c2"/>
      <stop offset="1" stop-color="#5f8aa1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="1040" cy="110" r="46" fill="#fbf6e6"/>
  <!-- far mountains (north) -->
  <path d="M0 300 L120 230 L260 280 L400 190 L540 270 L700 200 L860 275 L1000 215 L1200 265 V360 H0 z" fill="#a7b4b9"/>
  <path d="M0 335 L180 280 L330 320 L520 255 L700 315 L880 270 L1060 310 L1200 290 V380 H0 z" fill="#8a9ba0"/>
  <!-- river -->
  <rect y="370" width="1200" height="70" fill="url(#river)"/>
  <g stroke="#bcd3df" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M80 400 h70"/><path d="M340 420 h50"/><path d="M620 395 h80"/><path d="M930 425 h60"/>
  </g>
  <!-- gondola -->
  <path d="M0 150 Q600 260 1200 175" stroke="#4a4f55" stroke-width="3" fill="none"/>
  <g transform="translate(760 205)">
    <line x1="22" y1="0" x2="22" y2="22" stroke="#4a4f55" stroke-width="3"/>
    <rect x="0" y="22" width="44" height="40" rx="8" fill="#e8b23a"/>
    <rect x="7" y="29" width="30" height="16" rx="3" fill="#dfeef5"/>
  </g>
  <!-- near hillside (south) -->
  <path d="M0 440 Q300 420 600 450 T1200 445 V630 H0 z" fill="#6f8752"/>
  <path d="M0 500 Q350 475 700 505 T1200 500 V630 H0 z" fill="#5b7143"/>
  <!-- fence posts and wire -->
  <g stroke="#3d4247" stroke-width="5" stroke-linecap="round">
    <line x1="40" y1="430" x2="40" y2="500"/><line x1="160" y1="428" x2="160" y2="498"/>
    <line x1="280" y1="430" x2="280" y2="500"/><line x1="400" y1="434" x2="400" y2="504"/>
    <line x1="520" y1="440" x2="520" y2="510"/><line x1="640" y1="446" x2="640" y2="514"/>
    <line x1="760" y1="448" x2="760" y2="514"/><line x1="880" y1="446" x2="880" y2="512"/>
    <line x1="1000" y1="442" x2="1000" y2="508"/><line x1="1120" y1="440" x2="1120" y2="506"/>
  </g>
  <g stroke="#3d4247" stroke-width="2" fill="none">
    <path d="M40 440 L160 438 L280 440 L400 444 L520 450 L640 456 L760 458 L880 456 L1000 452 L1120 450 L1200 449"/>
    <path d="M40 460 L160 458 L280 460 L400 464 L520 470 L640 476 L760 478 L880 476 L1000 472 L1120 470 L1200 469"/>
    <path d="M40 480 L160 478 L280 480 L400 484 L520 490 L640 496 L760 498 L880 496 L1000 492 L1120 490 L1200 489"/>
  </g>
  <g stroke="#3d4247" stroke-width="2" fill="none" stroke-dasharray="4 10">
    <path d="M40 430 Q100 420 160 428 Q220 420 280 430 Q340 424 400 434 Q460 428 520 440 Q580 434 640 446 Q700 440 760 448 Q820 440 880 446 Q940 436 1000 442 Q1060 434 1120 440"/>
  </g>
  <!-- guard post -->
  <g transform="translate(180 330)">
    <rect x="0" y="40" width="90" height="110" fill="#d8d2c2"/>
    <rect x="-10" y="20" width="110" height="26" fill="#4e5a46"/>
    <rect x="16" y="58" width="58" height="22" fill="#3b4a55"/>
    <rect x="35" y="104" width="22" height="46" fill="#7a6a52"/>
  </g>
  <!-- path -->
  <path d="M520 630 Q560 560 620 520" stroke="#cdbf98" stroke-width="26" fill="none" stroke-linecap="round"/>
