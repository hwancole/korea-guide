<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0ef"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- mountains -->
  <path d="M0 400 L140 280 L260 360 L400 240 L560 380 L700 300 L860 390 L1000 270 L1200 380 V480 H0 z" fill="#a9bfd3"/>
  <path d="M400 240 L360 275 L385 270 L400 285 L418 268 L440 276 z M1000 270 L960 302 L985 298 L1000 312 L1018 296 L1040 304 z" fill="#ffffff"/>
  <!-- Seoul tower and skyline -->
  <g fill="#6f8aa3">
    <rect x="80" y="360" width="70" height="120"/>
    <rect x="160" y="330" width="55" height="150"/>
    <rect x="225" y="380" width="80" height="100"/>
    <rect x="315" y="345" width="50" height="135"/>
    <rect x="262" y="230" width="10" height="60"/>
    <path d="M245 290 h44 l-8 32 h-28 z"/>
    <rect x="261" y="322" width="12" height="60"/>
  </g>
  <!-- snow ground -->
  <rect y="470" width="1200" height="160" fill="#ffffff"/>
  <path d="M0 470 Q300 450 600 470 T1200 468 V490 H0 z" fill="#e3ecf5"/>
  <!-- padded coat -->
  <g transform="translate(560 150)">
    <path d="M60 0 Q100 -10 140 0 L200 40 L215 330 L-15 330 L0 40 z" fill="#1f3b57"/>
    <g stroke="#2f5578" stroke-width="4">
      <line x1="2" y1="100" x2="198" y2="100"/>
      <line x1="-3" y1="170" x2="203" y2="170"/>
      <line x1="-8" y1="240" x2="208" y2="240"/>
      <line x1="-12" y1="305" x2="212" y2="305"/>
    </g>
    <line x1="100" y1="10" x2="100" y2="330" stroke="#d9e3ec" stroke-width="5"/>
    <path d="M0 40 L-40 230 L-10 240 L20 110 z M200 40 L240 230 L210 240 L180 110 z" fill="#1f3b57"/>
    <path d="M60 0 Q100 30 140 0 L130 -20 Q100 -5 70 -20 z" fill="#c8453a"/>
  </g>
  <!-- beanie -->
  <g transform="translate(860 370)">
    <path d="M0 80 Q0 0 70 0 Q140 0 140 80 z" fill="#c8453a"/>
    <rect x="-6" y="70" width="152" height="30" rx="8" fill="#a83329"/>
    <circle cx="70" cy="-8" r="18" fill="#f3e6d8"/>
  </g>
  <!-- snowflakes -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="6"/><circle cx="260" cy="150" r="4"/><circle cx="420" cy="70" r="5"/>
    <circle cx="520" cy="190" r="4"/><circle cx="880" cy="80" r="6"/><circle cx="1010" cy="160" r="5"/>
    <circle cx="1120" cy="70" r="4"/><circle cx="760" cy="60" r="4"/><circle cx="60" cy="220" r="4"/>
    <circle cx="1150" cy="230" r="5"/><circle cx="340" cy="230" r="3"/><circle cx="960" cy="230" r="3"/>
  </g>
</svg>
