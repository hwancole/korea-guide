    <circle cx="980" cy="60" r="3"/><circle cx="1080" cy="120" r="2"/><circle cx="330" cy="210" r="2.5"/>
    <circle cx="860" cy="230" r="2"/><circle cx="150" cy="170" r="2"/><circle cx="560" cy="40" r="2"/>
  </g>
  <!-- tree glow -->
  <ellipse cx="600" cy="360" rx="300" ry="240" fill="url(#glow)"/>
  <!-- tree -->
