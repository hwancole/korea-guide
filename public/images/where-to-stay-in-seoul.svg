      <rect x="20" y="75" width="30" height="30"/><rect x="60" y="75" width="30" height="30"/><rect x="100" y="75" width="30" height="30"/>
      <rect x="20" y="125" width="30" height="30"/><rect x="60" y="125" width="30" height="30"/><rect x="100" y="125" width="30" height="30"/>
      <rect x="20" y="175" width="30" height="30"/><rect x="60" y="175" width="30" height="30"/><rect x="100" y="175" width="30" height="30"/>
    </g>
    <rect x="55" y="225" width="40" height="55" fill="#2a3746"/>
