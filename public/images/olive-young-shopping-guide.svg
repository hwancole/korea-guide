<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf5e4"/>
      <stop offset="1" stop-color="#f8f3ea"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="160" fill="#d4ecc8" opacity="0.7"/>
  <circle cx="110" cy="560" r="170" fill="#fbe1dc" opacity="0.8"/>
  <!-- bottles behind basket -->
  <rect x="330" y="150" width="90" height="230" rx="18" fill="#ffffff" stroke="#cfd8cc" stroke-width="3"/>
  <rect x="350" y="120" width="50" height="40" rx="8" fill="#7bb661"/>
  <rect x="345" y="230" width="60" height="70" rx="8" fill="#e8f3e1"/>
  <rect x="440" y="190" width="80" height="190" rx="40" fill="#f6c9c0"/>
  <rect x="462" y="160" width="36" height="40" rx="6" fill="#2f3b4c"/>
  <rect x="540" y="130" width="70" height="250" rx="12" fill="#fff8e7" stroke="#e5d7b5" stroke-width="3"/>
  <circle cx="575" cy="118" r="18" fill="#e8c66a"/>
  <!-- sunscreen tube -->
  <g transform="rotate(14 690 260)">
    <path d="M650 140 H730 L722 360 H658 Z" fill="#ffd56b"/>
    <rect x="665" y="360" width="50" height="30" rx="6" fill="#2f3b4c"/>
    <text x="690" y="250" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2f3b4c" text-anchor="middle">SPF</text>
    <text x="690" y="282" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2f3b4c" text-anchor="middle">50+</text>
  </g>
  <!-- basket -->
  <path d="M360 330 Q500 200 640 330" fill="none" stroke="#2f3b4c" stroke-width="14" stroke-linecap="round"/>
  <path d="M270 330 H830 L780 540 H320 Z" fill="#5fa046"/>
  <rect x="260" y="318" width="580" height="34" rx="12" fill="#4c8a37"/>
  <g stroke="#4c8a37" stroke-width="10" stroke-linecap="round">
    <line x1="380" y1="380" x2="395" y2="510"/>
    <line x1="480" y1="380" x2="485" y2="510"/>
    <line x1="580" y1="380" x2="575" y2="510"/>
    <line x1="680" y1="380" x2="665" y2="510"/>
    <line x1="770" y1="380" x2="750" y2="510"/>
  </g>
  <!-- sheet mask -->
  <g transform="rotate(-6 980 360)">
    <rect x="880" y="220" width="200" height="270" rx="16" fill="#ffffff" stroke="#d6d0c8" stroke-width="3"/>
    <ellipse cx="980" cy="335" rx="62" ry="78" fill="#fde8e4"/>
    <ellipse cx="958" cy="320" rx="13" ry="7" fill="#ffffff"/>
    <ellipse cx="1002" cy="320" rx="13" ry="7" fill="#ffffff"/>
    <path d="M960 365 Q980 378 1000 365" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <text x="980" y="455" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#5fa046" text-anchor="middle">1+1</text>
  </g>
  <!-- tax free tag -->
  <g transform="rotate(-10 150 200)">
    <rect x="70" y="150" width="190" height="96" rx="14" fill="#d9534f"/>
    <circle cx="95" cy="198" r="9" fill="#f8f3ea"/>
    <text x="175" y="192" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">TAX</text>
    <text x="175" y="228" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">FREE</text>
  </g>
</svg>
