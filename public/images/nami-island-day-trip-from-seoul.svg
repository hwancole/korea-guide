<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d9b0"/>
      <stop offset="1" stop-color="#fbeedc"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa8bf"/>
      <stop offset="1" stop-color="#4f7d98"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="980" cy="120" r="52" fill="#fff4d6"/>
  <!-- mountains -->
  <path d="M0 330 L150 220 L280 290 L430 170 L600 280 L760 190 L920 280 L1060 210 L1200 270 V400 H0 z" fill="#a9a6b8"/>
  <path d="M0 370 L200 290 L360 340 L540 260 L720 335 L900 280 L1200 350 V420 H0 z" fill="#8c8aa0"/>
  <!-- river -->
  <rect y="400" width="1200" height="230" fill="url(#water)"/>
  <g stroke="#a9c7d8" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M90 540 h80"/><path d="M260 590 h60"/><path d="M820 560 h90"/><path d="M1000 600 h70"/><path d="M560 600 h50"/>
  </g>
  <!-- island -->
  <path d="M380 420 Q620 360 1200 395 V445 Q800 470 380 440 z" fill="#6f8f4e"/>
  <path d="M380 440 Q800 470 1200 445 V455 Q800 482 400 452 z" fill="#5a7440"/>
  <!-- tall trees (metasequoia, golden) -->
  <g fill="#c8782f">
    <path d="M520 420 l14 -150 l14 150 z"/><path d="M570 418 l14 -165 l14 165 z"/><path d="M620 415 l14 -175 l14 175 z"/>
    <path d="M670 413 l14 -180 l14 180 z"/><path d="M720 412 l14 -185 l14 185 z"/><path d="M770 411 l14 -180 l14 180 z"/>
    <path d="M820 411 l14 -175 l14 175 z"/><path d="M870 412 l14 -170 l14 170 z"/><path d="M920 413 l14 -160 l14 160 z"/>
  </g>
  <g fill="#e2a33c">
    <circle cx="470" cy="400" r="26"/><circle cx="990" cy="395" r="30"/><circle cx="1060" cy="398" r="26"/><circle cx="1130" cy="400" r="28"/>
  </g>
  <!-- ferry -->
  <g transform="translate(170 470)">
    <path d="M0 40 L240 40 L215 72 L22 72 z" fill="#ffffff"/>
    <rect x="50" y="5" width="140" height="35" rx="6" fill="#d94f3d"/>
    <g fill="#ffffff"><rect x="62" y="14" width="22" height="16" rx="3"/><rect x="94" y="14" width="22" height="16" rx="3"/><rect x="126" y="14" width="22" height="16" rx="3"/><rect x="158" y="14" width="22" height="16" rx="3"/></g>
    <path d="M-30 80 Q60 70 120 80 Q190 90 270 80" stroke="#cfe2ec" stroke-width="4" fill="none"/>
  </g>
</svg>
