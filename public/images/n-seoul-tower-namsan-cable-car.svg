<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3a6b"/>
      <stop offset="0.55" stop-color="#c46f7a"/>
      <stop offset="1" stop-color="#f3c08a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- city skyline -->
  <g fill="#3a3550" opacity="0.85">
    <rect x="0" y="520" width="60" height="110"/><rect x="70" y="495" width="45" height="135"/><rect x="125" y="530" width="70" height="100"/>
    <rect x="980" y="505" width="55" height="125"/><rect x="1045" y="480" width="40" height="150"/><rect x="1095" y="525" width="105" height="105"/>
  </g>
  <!-- Namsan mountain -->
  <path d="M0 600 Q250 520 420 430 Q560 350 640 340 Q760 345 880 430 Q1040 520 1200 590 V630 H0 z" fill="#3f6b55"/>
  <path d="M0 630 Q300 560 600 560 Q900 560 1200 630 z" fill="#345a47"/>
  <!-- tower -->
  <rect x="628" y="170" width="18" height="175" fill="#e9e4dc"/>
  <rect x="596" y="210" width="82" height="34" rx="8" fill="#f4f0e8"/>
  <rect x="604" y="244" width="66" height="12" fill="#d8d2c6"/>
  <rect x="633" y="80" width="8" height="92" fill="#e9e4dc"/>
  <rect x="635" y="40" width="4" height="42" fill="#ffffff"/>
  <circle cx="637" cy="40" r="5" fill="#ff5a5a"/>
  <g fill="#ffd68a"><rect x="604" y="220" width="10" height="8"/><rect x="620" y="220" width="10" height="8"/><rect x="636" y="220" width="10" height="8"/><rect x="652" y="220" width="10" height="8"/></g>
  <!-- cable line and gondola -->
  <path d="M120 600 L600 360" stroke="#2a2a33" stroke-width="3"/>
  <line x1="340" y1="490" x2="340" y2="508" stroke="#2a2a33" stroke-width="3"/>
  <rect x="312" y="506" width="56" height="40" rx="8" fill="#c8322f"/>
  <rect x="320" y="514" width="40" height="14" rx="3" fill="#ffe2b8"/>
  <!-- title -->
  <text x="60" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#ffffff" font-weight="bold">N Seoul Tower</text>
  <text x="62" y="160" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#fbe9dc">Tickets · Cable car · Bus · Walking up</text>
</svg>
