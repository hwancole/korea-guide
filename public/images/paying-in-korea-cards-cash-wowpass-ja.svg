<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f4f1ea"/>
  <rect y="520" width="1200" height="110" fill="#e6e0d3"/>
  <!-- credit card -->
  <g transform="rotate(-8 840 250)">
    <rect x="700" y="150" width="280" height="180" rx="20" fill="#0052a4"/>
    <rect x="700" y="190" width="280" height="32" fill="#1d1d1f"/>
    <rect x="732" y="246" width="50" height="38" rx="6" fill="#f6c76b"/>
    <g fill="#ffffff" opacity="0.85">
      <rect x="732" y="300" width="48" height="10" rx="5"/>
      <rect x="792" y="300" width="48" height="10" rx="5"/>
      <rect x="852" y="300" width="48" height="10" rx="5"/>
    </g>
  </g>
  <!-- banknotes -->
  <g>
    <rect x="770" y="360" width="250" height="125" rx="10" fill="#c8b98a"/>
    <rect x="760" y="345" width="250" height="125" rx="10" fill="#e7d9a8"/>
    <rect x="750" y="330" width="250" height="125" rx="10" fill="#f3e7bd" stroke="#b9a66a" stroke-width="4"/>
    <circle cx="875" cy="392" r="36" fill="none" stroke="#b9a66a" stroke-width="5"/>
    <text x="875" y="407" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#8a7a45" text-anchor="middle">₩</text>
  </g>
  <!-- prepaid transit card -->
  <g transform="rotate(9 1060 400)">
    <rect x="980" y="300" width="170" height="230" rx="20" fill="#00a84d"/>
    <circle cx="1065" cy="350" r="20" fill="#ffffff" opacity="0.9"/>
    <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
      <path d="M1030 420 Q1048 440 1030 460"/>
      <path d="M1052 405 Q1080 440 1052 475"/>
      <path d="M1074 390 Q1112 440 1074 490"/>
    </g>
  </g>
  <text x="70" y="250" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="58" font-weight="700" fill="#1d2b3a">韓国旅行のお金</text>
  <text x="70" y="330" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="40" font-weight="700" fill="#0052a4">クレカ・両替・WOWPASS</text>
  <text x="70" y="395" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="30" fill="#4a5866">手数料と使い分けを比較</text>
</svg>
