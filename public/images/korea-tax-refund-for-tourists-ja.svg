<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f4f1ea"/>
  <rect y="520" width="1200" height="110" fill="#e6e0d3"/>
  <!-- shopping bag -->
  <g>
    <path d="M820 230 Q820 160 880 160 Q940 160 940 230" fill="none" stroke="#7a2e3b" stroke-width="12" stroke-linecap="round"/>
    <rect x="760" y="220" width="240" height="290" rx="14" fill="#c8455a"/>
    <rect x="760" y="220" width="240" height="40" rx="14" fill="#a8364a"/>
    <circle cx="880" cy="370" r="54" fill="#ffffff" opacity="0.92"/>
    <text x="880" y="390" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#c8455a" text-anchor="middle">₩</text>
  </g>
  <!-- passport -->
  <g transform="rotate(-10 700 420)">
    <rect x="620" y="320" width="150" height="200" rx="12" fill="#1d3a6b"/>
    <circle cx="695" cy="400" r="34" fill="none" stroke="#e9c46a" stroke-width="5"/>
    <rect x="655" y="465" width="80" height="10" rx="5" fill="#e9c46a"/>
  </g>
  <!-- receipt -->
  <g transform="rotate(8 1080 380)">
    <path d="M1010 250 H1150 V500 L1135 488 L1120 500 L1105 488 L1090 500 L1075 488 L1060 500 L1045 488 L1030 500 L1010 488 Z" fill="#ffffff" stroke="#cfc6b3" stroke-width="3"/>
    <text x="1080" y="300" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f7a4a" text-anchor="middle">TAX FREE</text>
    <g fill="#b8b0a0">
      <rect x="1030" y="330" width="100" height="9" rx="4"/>
      <rect x="1030" y="355" width="80" height="9" rx="4"/>
      <rect x="1030" y="380" width="100" height="9" rx="4"/>
      <rect x="1030" y="405" width="60" height="9" rx="4"/>
    </g>
    <rect x="1030" y="440" width="100" height="14" rx="4" fill="#0f7a4a"/>
  </g>
  <text x="70" y="250" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="58" font-weight="700" fill="#1d2b3a">韓国の免税のやり方</text>
  <text x="70" y="330" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="40" font-weight="700" fill="#c8455a">即時還付と空港手続き</text>
  <text x="70" y="395" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="30" fill="#4a5866">1万5,000ウォンから・2026年版</text>
