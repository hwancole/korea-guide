<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0ef"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- mountains -->
  <path d="M600 400 L720 300 L820 370 L960 250 L1080 360 L1200 300 V480 H600 z" fill="#a9bfd3"/>
  <path d="M960 250 L922 282 L946 278 L960 292 L977 276 L998 284 z" fill="#ffffff"/>
  <!-- tower and skyline -->
  <g fill="#6f8aa3">
    <rect x="640" y="380" width="60" height="100"/>
    <rect x="1110" y="360" width="60" height="120"/>
    <rect x="1045" y="395" width="55" height="85"/>
    <rect x="1075" y="250" width="10" height="60"/>
    <path d="M1058 310 h44 l-8 32 h-28 z"/>
    <rect x="1074" y="342" width="12" height="60"/>
  </g>
  <!-- snow ground -->
  <rect y="470" width="1200" height="160" fill="#ffffff"/>
  <path d="M0 470 Q300 450 600 470 T1200 468 V490 H0 z" fill="#e3ecf5"/>
  <!-- long padded coat -->
  <g transform="translate(760 140)">
    <path d="M60 0 Q100 -10 140 0 L200 40 L215 330 L-15 330 L0 40 z" fill="#1f3b57"/>
    <g stroke="#2f5578" stroke-width="4">
      <line x1="2" y1="100" x2="198" y2="100"/>
      <line x1="-3" y1="170" x2="203" y2="170"/>
      <line x1="-8" y1="240" x2="208" y2="240"/>
      <line x1="-12" y1="305" x2="212" y2="305"/>
    </g>
    <line x1="100" y1="10" x2="100" y2="330" stroke="#d9e3ec" stroke-width="5"/>
    <path d="M0 40 L-40 230 L-10 240 L20 110 z M200 40 L240 230 L210 240 L180 110 z" fill="#1f3b57"/>
    <path d="M60 0 Q100 30 140 0 L130 -20 Q100 -5 70 -20 z" fill="#c8453a"/>
  </g>
  <!-- beanie -->
  <g transform="translate(1010 430)">
    <path d="M0 70 Q0 0 60 0 Q120 0 120 70 z" fill="#c8453a"/>
    <rect x="-6" y="62" width="132" height="26" rx="10" fill="#a8362d"/>
    <circle cx="60" cy="-8" r="16" fill="#f3f3f3"/>
  </g>
  <!-- snowflakes -->
  <g fill="#ffffff">
    <circle cx="620" cy="90" r="6"/><circle cx="700" cy="180" r="5"/><circle cx="1050" cy="80" r="7"/>
    <circle cx="1150" cy="190" r="5"/><circle cx="560" cy="230" r="4"/><circle cx="1000" cy="160" r="4"/>
    <circle cx="80" cy="60" r="5"/><circle cx="460" cy="70" r="6"/><circle cx="300" cy="440" r="5"/>
  </g>
  <text x="70" y="220" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="62" font-weight="700" fill="#1d2b3a">冬の韓国の服装</text>
  <text x="70" y="300" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="38" font-weight="700" fill="#1f3b57">12〜2月の気温と防寒対策</text>
  <text x="70" y="365" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="30" fill="#4a5866">ソウルの1月は盛岡並みの寒さ</text>
</svg>
