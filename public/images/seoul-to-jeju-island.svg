<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0f5"/>
      <stop offset="1" stop-color="#eaf6fc"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f9fc9"/>
      <stop offset="1" stop-color="#1f6f9c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="1040" cy="110" r="52" fill="#ffd36b"/>
  <!-- Seoul skyline, left -->
  <g fill="#6d7f93">
    <rect x="30" y="330" width="50" height="110"/>
    <rect x="90" y="290" width="40" height="150"/>
    <rect x="140" y="345" width="60" height="95"/>
    <rect x="210" y="310" width="38" height="130"/>
    <rect x="256" y="360" width="54" height="80"/>
    <rect x="183" y="250" width="8" height="70"/>
    <ellipse cx="187" cy="250" rx="16" ry="8"/>
    <rect x="183" y="230" width="8" height="22"/>
  </g>
  <!-- sea -->
  <rect y="440" width="1200" height="190" fill="url(#sea)"/>
  <path d="M0 470 Q60 460 120 470 T240 470 T360 470 T480 470 T600 470 T720 470 T840 470 T960 470 T1080 470 T1200 470" fill="none" stroke="#9fd3ea" stroke-width="3" opacity="0.7"/>
  <path d="M0 540 Q60 530 120 540 T240 540 T360 540 T480 540 T600 540 T720 540 T840 540 T960 540 T1080 540 T1200 540" fill="none" stroke="#9fd3ea" stroke-width="3" opacity="0.5"/>
  <!-- Jeju island with Hallasan, right -->
  <path d="M700 452 Q760 420 840 400 Q920 330 990 335 Q1060 340 1110 410 Q1160 425 1190 452 z" fill="#4f8a5b"/>
  <path d="M960 345 Q990 330 1020 345 L1005 352 Q990 346 975 352 z" fill="#f4f7f2"/>
  <ellipse cx="945" cy="455" rx="260" ry="10" fill="#e8d9a8"/>
  <!-- small ferry -->
  <g transform="translate(520 500)">
    <path d="M-50 0 H50 L36 22 H-36 z" fill="#ffffff"/>
    <rect x="-28" y="-20" width="50" height="20" fill="#f2f2f2"/>
    <rect x="-18" y="-34" width="26" height="14" fill="#e2573b"/>
  </g>
  <!-- flight path and plane -->
  <path d="M230 220 Q560 40 960 260" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="14 12"/>
  <g transform="translate(600 120) rotate(8)">
    <path d="M-60 0 Q-60 -10 -40 -10 H50 Q70 -10 74 0 Q70 10 50 10 H-40 Q-60 10 -60 0 z" fill="#ffffff" stroke="#9aa9b8" stroke-width="2"/>
    <path d="M-5 -8 L-30 -48 H-14 L25 -8 z" fill="#2b6fa6"/>
    <path d="M-5 8 L-30 48 H-14 L25 8 z" fill="#2b6fa6"/>
    <path d="M-50 -8 L-62 -30 H-50 L-36 -8 z" fill="#2b6fa6"/>
    <circle cx="56" cy="-2" r="3" fill="#2b6fa6"/>
  </g>
  <!-- title -->
  <text x="600" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Seoul → Jeju Island</text>
</svg>
